name: Firebase Deploy - CI/CD

on:
    push:
        branches:
            - "main"
        paths-ignore:
            - "**/*.md"
            - "docs/**"
            - "LICENSE"
            - ".claude/**"
            - "models-src/**"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false

env:
    # Pinned rather than `npm i -g firebase-tools`, so a CLI release can never
    # change what a re-run of an old commit deploys.
    FIREBASE_TOOLS_VERSION: "14.27.0"

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
            - run: npm ci
            - run: npm run lint

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
            - run: npm ci
            - run: npm run typecheck

    build_and_deploy:
        name: Build and Deploy
        needs: [lint, typecheck]
        runs-on: ubuntu-latest
        env:
            GOOGLE_APPLICATION_CREDENTIALS: google-application-credentials.json
            FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            - run: npm ci

            # Turbopack's build cache. Keyed on the lockfile plus the sources so
            # a source change reuses module compilation without reusing output.
            - name: Restore Next.js build cache
              uses: actions/cache@v4
              with:
                  path: .next/cache
                  key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
                  restore-keys: |
                      nextjs-${{ hashFiles('package-lock.json') }}-

            # These are repository VARIABLES, not secrets. Next inlines them into
            # the bundle, so they are public by definition — and Actions masks
            # secret values in logs, which would only make build failures harder
            # to read. The Firebase web API key is an identifier; Database Rules
            # are the actual access control.
            #
            # Leave them unset and the build still succeeds: the presence counter
            # detects the missing config and stays hidden.
            #
            # The `||` fallbacks keep deploys working until the repository
            # variables are renamed from VITE_* to NEXT_PUBLIC_*. Drop them once
            # the new names exist in Settings → Secrets and variables → Actions.
            - name: Build
              env:
                  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
                  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
                  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
                  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
                  NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ vars.NEXT_PUBLIC_FIREBASE_DATABASE_URL || vars.VITE_FIREBASE_DATABASE_URL }}
                  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
                  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
                  NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY || vars.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
              run: npm run build

            - name: Install Firebase CLI
              run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

            - name: Prepare Google Application Credentials
              env:
                  CREDENTIALS_BASE64: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_BASE64 }}
              shell: bash
              run: echo "$CREDENTIALS_BASE64" | base64 --decode > "google-application-credentials.json"

            # Rules before hosting: if a rules change is rejected the deploy stops
            # before the new bundle is live, rather than shipping a client that
            # expects rules the database does not yet have.
            - name: Deploy Realtime Database Rules
              run: firebase deploy --only database --project "$FIREBASE_PROJECT_ID" --non-interactive

            # No firestore:indexes target — the stats docs are fetched by id with
            # no composite queries, so there is no index to deploy.
            - name: Deploy Firestore Rules
              run: firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive

            - name: Deploy Hosting
              run: firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive

            - name: Remove Credentials File
              if: always()
              run: rm -f google-application-credentials.json
